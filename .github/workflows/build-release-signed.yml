name: Build ARSAM Release (Signed)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Licenses & SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.5 || true; fi
          chmod +x gradlew || true

      - name: Restore keystore from secrets
        env:
          ARSAM_KEYSTORE_BASE64: ${{ secrets.ARSAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ARSAM_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing secret ARSAM_KEYSTORE_BASE64. See SIGNING.md"
            exit 1
          fi
          echo "$ARSAM_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/arsam-release.jks"
          echo "ARSAM_KEYSTORE_PATH=$GITHUB_WORKSPACE/arsam-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          ARSAM_KEYSTORE_PASSWORD: ${{ secrets.ARSAM_KEYSTORE_PASSWORD }}
          ARSAM_KEY_ALIAS: ${{ secrets.ARSAM_KEY_ALIAS }}
          ARSAM_KEY_PASSWORD: ${{ secrets.ARSAM_KEY_PASSWORD }}
        run: |
          test -n "$ARSAM_KEYSTORE_PASSWORD"
          test -n "$ARSAM_KEY_ALIAS"
          test -n "$ARSAM_KEY_PASSWORD"
          if [ -x ./gradlew ]; then ./gradlew assembleRelease --no-daemon --stacktrace
          else gradle assembleRelease --no-daemon --stacktrace; fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARSAM-release-signed
          path: app/build/outputs/apk/release/*.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/arsam-release.jks"
