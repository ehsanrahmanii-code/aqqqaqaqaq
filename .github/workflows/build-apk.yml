name: Build ARSAM APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Show repo layout
        run: |
          ls -la
          ls -la app || echo "MISSING app/"
          ls -la app/src/main/python || echo "MISSING python/"
          test -f settings.gradle && echo OK settings || echo MISSING settings.gradle
          test -f app/build.gradle && echo OK app/build.gradle || echo MISSING app/build.gradle
          test -f app/src/main/python/arsam_engine.py && echo OK engine || echo MISSING engine

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ARSAM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
